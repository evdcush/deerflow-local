user nginx;
worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        "~*^https" https;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' '';
    }

    server {
        listen 2026;
        server_name _;

        # Container names: nginx also sits on ai-backend, where short
        # service names like "gateway" may belong to other projects.
        set $gateway_upstream deer-flow-gateway:8001;
        set $frontend_upstream deer-flow-frontend:3000;

        client_max_body_size 101M;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        location ^~ /api/langgraph/ {
            rewrite ^/api/langgraph/(.*)$ /api/$1 break;
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Accel-Buffering no;
        }

        location ~ ^/(api(?:/|$)|health(?:/|$)|docs(?:/|$)|redoc(?:/|$)|openapi\.json$) {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Accel-Buffering no;
        }

        location / {
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    # Egress allowlist: the gateway's only outside services. The gateway
    # is on the internal network alone, so these are its only way out.
    server {
        listen 4000;
        client_max_body_size 0;  # long contexts and images
        location / {
            set $litellm_upstream litellm:4000;
            proxy_pass http://$litellm_upstream;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }
    }

    server {
        listen 8080;
        location / {
            set $search_upstream search-gateway:8080;
            proxy_pass http://$search_upstream;
            proxy_http_version 1.1;
            proxy_read_timeout 300s;
        }
    }
}
